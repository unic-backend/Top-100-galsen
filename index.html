<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 100 Galsen</title>
<meta name="description" content="Classements des meilleurs rappeurs, rappeuses et artistes mbalax du Sénégal, de France et des États-Unis.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Top 100 <span>Galsen</span></h1>
  <p>Le meilleur du rap et du mbalax sénégalais 🇸🇳</p>
</header>
<nav role="tablist" aria-label="Classement">
  <button role="tab" data-tab="rappeurs" aria-selected="true">Rappeurs</button>
  <button role="tab" data-tab="rappeuses" aria-selected="false">Rappeuses</button>
  <button role="tab" data-tab="mbalax" aria-selected="false">Mbalax</button>
  <button role="tab" data-tab="albums" aria-selected="false">Albums</button>
  <button role="tab" data-tab="sons" aria-selected="false">Sons & Clips</button>
</nav>
<form id="filters" role="search">
  <input type="search" name="q" placeholder="Rechercher un artiste, un son…" aria-label="Rechercher">
</form>
<main><ol id="list"></ol><p id="empty" hidden>Aucun résultat.</p></main>
<footer>Score = 70 % YouTube (vues, commentaires, likes) + 30 % votes du mois<span id="updated"></span></footer>
<script src="app.js"></script>
</body>
</html>
