name: Bot classement
on:
  schedule: [{ cron: '17 3 * * *' }] # chaque jour 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node check.js && node bot/collect.test.js
      - run: node bot/collect.js
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "top100-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Bot : mise à jour classement" && git push)
